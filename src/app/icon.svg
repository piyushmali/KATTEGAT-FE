<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="KATTEGAT">
  <!--
    The mark: a harbour beacon inside a compass rose.

    Authored as vector rather than exported from the brand sheet, because a favicon is a
    16px problem and the sheet's artwork carries detail that turns to mud at that size. The
    forms here are the kit's, reduced until each one still reads as itself in a browser tab:
    solid tower, solid compass points, one ring.

    Filled shapes over thin strokes for the same reason. A 1px stroke on a 16px canvas is a
    grey smudge at any device pixel ratio that is not exactly 1.

    `background` is painted rather than left transparent. Browser tabs, bookmark bars and
    Telegram all composite favicons against their own chrome, and an amber lighthouse on a
    light tab background loses the contrast the dark ground provides.
  -->
  <rect width="64" height="64" rx="12" fill="#03080E" />

  <!-- Compass points. Beyond the ring, so the silhouette is not a plain circle at small sizes. -->
  <g fill="#E3AC4E">
    <path d="M32 2 33.6 24 32 27 30.4 24Z" />
    <path d="M32 62 33.6 40 32 37 30.4 40Z" />
    <path d="M2 32 24 30.4 27 32 24 33.6Z" />
    <path d="M62 32 40 30.4 37 32 40 33.6Z" />
  </g>

  <!-- The ring. Thick enough to survive downscaling. -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#E3AC4E" stroke-width="2.4" />

  <!-- Beacon: lamp, tapered tower, base. -->
  <g fill="#E3AC4E">
    <circle cx="32" cy="20.5" r="3.1" />
    <path d="M29.4 24.5h5.2l2 17.5h-9.2Z" />
    <rect x="25.4" y="42" width="13.2" height="2.6" rx="0.8" />
  </g>

  <!-- Water. Two bars rather than drawn waves; at 16px a wave becomes noise. -->
  <g fill="#E3AC4E" opacity="0.78">
    <rect x="20" y="47.4" width="24" height="2.2" rx="1.1" />
    <rect x="25" y="51.6" width="14" height="2" rx="1" />
  </g>
</svg>
